<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask FEMA | Chris Bogdewic</title>
<meta name="description" content="Ask plain-English questions about U.S. disaster declarations. Answers come from a SQL query run on live OpenFEMA data.">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/static/ask-fema.css">
<style>
  /* Page chrome for the standalone page (same tokens and nav as www.bogdewic.com). */
  :root { --ink:#1d2b3a; --ink-2:#465667; --ink-3:#5f6f80; --bg-alt:#f4f6f8; --line:#e2e7ec; --blue:#0071e3; --blue-text:#0062c4;
          --grad:linear-gradient(95deg,#0071e3 0%,#14a37f 55%,#e0598b 100%); --page:max(20px,calc((100% - 1080px)/2));
          --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:400 17px/1.55 var(--font); letter-spacing:-.011em; -webkit-font-smoothing:antialiased; }
  .site-nav { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px; height:52px; padding:0 max(16px,calc((100% - 1080px)/2));
              background:rgba(255,255,255,.82); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid rgba(29,43,58,.08); }
  .sn-brand { display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink); }
  .sn-mark { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#0071e3,#14a37f 60%,#e0598b); color:#fff; font-size:11px; font-weight:700; }
  .sn-name { font-weight:600; font-size:16px; letter-spacing:-.015em; }
  .sn-links { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:2px; list-style:none; margin:0 0 0 auto; padding:0; }
  .sn-links a { display:block; padding:6px 11px; border-radius:999px; text-decoration:none; font-size:13.5px; color:var(--ink-2); }
  .sn-links a:hover { color:var(--blue); }
  .hero { padding:clamp(56px,9vw,96px) var(--page) clamp(40px,5vw,60px); text-align:center;
          background:radial-gradient(1100px 520px at 50% -10%,rgba(0,113,227,.08),transparent 70%),radial-gradient(700px 420px at 85% 20%,rgba(224,89,139,.06),transparent 70%),radial-gradient(700px 420px at 12% 30%,rgba(20,163,127,.06),transparent 70%),#fff; }
  .eyebrow { margin:0 0 14px; font-size:clamp(17px,1.6vw,21px); font-weight:600; color:var(--blue-text); }
  h1 { margin:0 auto; max-width:17ch; font-size:clamp(38px,6vw,68px); line-height:1.05; letter-spacing:-.035em; text-wrap:balance; }
  .grad { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lede { margin:22px auto 0; max-width:640px; font-size:clamp(18px,1.8vw,21px); color:var(--ink-2); }
  .section { padding:clamp(40px,6vw,72px) var(--page); background:var(--bg-alt); }
  .footer { display:flex; justify-content:center; align-items:center; gap:12px; padding:28px var(--page); border-top:1px solid var(--line); font-size:13px; color:var(--ink-3); }
  .footer a { color:var(--blue-text); text-decoration:none; font-weight:500; }
  @media (max-width:640px) { .sn-links { display:none; } }
</style>
</head>
<body>
  <header class="site-nav">
    <a class="sn-brand" href="https://www.bogdewic.com/" aria-label="Bogdewic home"><span class="sn-mark">CB</span><span class="sn-name">Bogdewic</span></a>
    <nav aria-label="Main"><ul class="sn-links">
      <li><a href="https://www.bogdewic.com/#projects">Projects</a></li>
      <li><a href="https://www.bogdewic.com/fema-disasters.html">FEMA report</a></li>
      <li><a href="https://dashboard.bogdewic.com/">Dashboard</a></li>
    </ul></nav>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">AI agent · FEMA data</p>
      <h1>Ask <span class="grad">FEMA</span> anything about U.S. disasters.</h1>
      <p class="lede">Ask a question in plain English. The agent writes a SQL query, runs it on live OpenFEMA data, and answers only from the rows that come back.</p>
    </section>
    <section class="section af-on-grey">
      <div id="ask-fema" class="af"></div>
    </section>
  </main>
  <footer class="footer"><span class="sn-mark">CB</span><span>© 2026 Chris Bogdewic · <a href="https://www.bogdewic.com/">bogdewic.com</a></span></footer>
  <script src="/static/ask-fema.js" defer></script>
</body>
</html>
