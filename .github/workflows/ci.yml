name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by deploy.yml, which runs the same checks first

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests (offline, deterministic fake LLM)
        run: pytest -q
      - name: Docker build smoke test
        run: |
          mkdir -p data && python - <<'EOF'
          import duckdb; c = duckdb.connect("data/fema.duckdb")
          c.execute("CREATE TABLE declarations (disaster_number INTEGER)"); c.close()
          EOF
          docker build -t fema-qa-agent:ci .
