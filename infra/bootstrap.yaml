AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time setup for fema-qa-agent: GitHub OIDC trust (no stored AWS keys), an ECR repository for
  the container image, the Lambda execution role, and a least-privilege deploy role for GitHub Actions.
  The Lambda function itself is created by the deploy workflow on first run.

Parameters:
  GitHubOwner:
    Type: String
    Default: cbogdewi
  GitHubRepo:
    Type: String
    Default: fema-qa-agent
  GitHubOwnerId:
    Type: String
    Default: "4121772"
    Description: Numeric GitHub owner ID (GitHub now includes it in the OIDC subject claim).
  GitHubRepoId:
    Type: String
    Default: "1472476036"
    Description: Numeric GitHub repository ID.
  FunctionName:
    Type: String
    Default: fema-qa-agent
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref FunctionName
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep last 3 images (stays inside free storage)",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":3},
            "action":{"type":"expire"}}]}

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 14

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only the main branch of this one repository can deploy. GitHub's subject claim now
                # embeds immutable owner/repo IDs; the legacy name-only form is accepted too.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:DescribeImages
                Resource: !GetAtt ImageRepository.Arn
              - Sid: LambdaManage
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}"
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LambdaExecutionRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: lambda.amazonaws.com }

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repo variable AWS_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  LambdaRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  EcrRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
